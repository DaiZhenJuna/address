name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.4.0
        required: true
        default: v2.4.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Postcodes
          - Every published address outside China and Hong Kong carries a postcode in its country's format. Imports store postcode-less rows unpublished; post-import inference publishes them once a postcode is found, so an interrupted sync never publishes an address without one.
          - Missing postcodes are filled from official sources when the match is unique: Chunghwa Post township codes (TW), Statistics Canada NAR (CA), IBGE CNEFE 2022 (BR), BANO (FR), PDOK BAG (NL) and OpenStreetMap postcode areas (DE). Register matches need the same house number within 60 m.
          - An inferred postcode re-checks the address's administrative names, correcting departments it disproves (for example Coinches, 88100, Vosges).
          - Rows retired for good (missing postcode, structure or administrative-name repairs) are deleted with their evidence once their country's sources have run. Rows imported in the last 24 hours and Korean rows waiting for postcode areas are kept.

          ### Sync
          - Storage-limit failures are a resource wait, not a source fault: no job starts above the soft limit or below the free-disk reserve, and sources suspended only by storage resume once there is room.
          - Overture address files are mirrored locally once per release and exported from disk. DuckDB threads, memory and the storage budget are configurable.
          - Popular metro areas fill first, then popular regions, then the balanced remainder. Popular-city exports run before regional shards.
          - Country counts and coverage after an import read the generation index; the full projection reconciliation runs at most once a day.

          ### Translation
          - English-first publication: an address publishes once its English variant is valid, and Chinese fields are translated later.
          - Phrase-like renderings are rejected (sentences, replies, times, missing street types), and Chinese street types are normalized.
          - Translation recovery queries walk their indexes per status, ending statement timeouts under load.
          - Index-Translate runs through OpenAI-compatible credentials, so self-hosted or proxied Index models work beside the official route.

          ### Upgrade notes
          - The first start rescans each country once for postcodes and administrative names, then purges permanently retired rows. Allow several hours on a large pool.
          - New optional settings: `ADDRESS_STORAGE_SOFT_LIMIT_BYTES`, `ADDRESS_STORAGE_HARD_LIMIT_BYTES` and `POSTGRES_SHM_SIZE`.

          ### Verification
          - 1,720 JavaScript/TypeScript tests, Python tests, type checks, build and the public-release audit.
          - Live API validation, 500 live address-contract samples for each of 27 countries, and a full-pool quality audit with every blocking rule at zero.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
