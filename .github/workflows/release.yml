name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v2.3.0
        required: true
        default: v2.3.0

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run check:public
      - run: bash -n ops/*.sh
      - run: python3 -m py_compile server/sync/*.py

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve and validate version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version='${{ inputs.version }}'
          else
            version="${GITHUB_REF_NAME}"
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          package_version=$(node -p "require('./package.json').version")
          [[ "$version" == "v$package_version" ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - name: Reject duplicate release
        shell: bash
        run: |
          if gh release view '${{ steps.version.outputs.value }}' --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Release already exists' >&2
            exit 1
          fi
      - name: Create tag for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          if git ls-remote --exit-code --tags origin "refs/tags/$version" >/dev/null 2>&1; then
            echo 'Tag already exists' >&2
            exit 1
          fi
          gh api --method POST "/repos/$GITHUB_REPOSITORY/git/refs" -f "ref=refs/tags/$version" -f "sha=$GITHUB_SHA" >/dev/null
      - name: Build public VPS packages
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          mkdir -p "release/$name"
          for path in .dockerignore .env.example Dockerfile docker-compose.yml LICENSE README.md README.zh-CN.md README.zh-TW.md astro.config.mjs package.json package-lock.json tsconfig.json config docs image ops public scripts server src; do
            cp -a "$path" "release/$name/"
          done
          cp -a dist "release/$name/dist"
          find "release/$name" -type d -name __pycache__ -prune -exec rm -rf {} +
          tar -C release -czf "release/$name.tar.gz" "$name"
          (cd release && zip -qr "$name.zip" "$name")
          (cd release && sha256sum "$name.tar.gz" "$name.zip" > SHA256SUMS.txt)
      - name: Audit package contents
        shell: bash
        run: |
          set -euo pipefail
          version='${{ steps.version.outputs.value }}'
          name="address-$version"
          test -s "release/$name.tar.gz"
          test -s "release/$name.zip"
          test -s release/SHA256SUMS.txt
          if find "release/$name" -type f \( -name '.env' -o -name '*.sqlite' -o -name '*.db' -o -name '*.pem' -o -name '*.key' \) -print -quit | grep -q .; then
            echo 'Private file shape found in release package' >&2
            exit 1
          fi
          (cd release && sha256sum -c SHA256SUMS.txt)
      - name: Write release notes
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          cat > release/RELEASE_NOTES.md <<'NOTES'
          ### Location selection
          - Region and city options are built from the published addresses themselves: every published address is reachable from the dropdowns, option counts add up to the country total, and generating for an option returns exactly the addresses it counts.
          - Region names match across scripts, administrative suffixes, accents and successor units (Vietnam's 2025 provincial merger); unrecognized regions are corrected from boundary polygons or nearby catalog cities, and the importer applies the same gate.
          - Corrected machine-translated Chinese catalog names (reviewed corrections table), official Japanese prefecture names (東京都, 大阪府) and US territory labels.

          ### Address repair and quality
          - Administrative-name repair runs per country with its own revision; it fixes region codes and names, city fields holding codes or numbers, and mixed-level countries checked against first-level polygons.
          - Published rows that no longer pass the import gate are repaired or retired, so dropdown counts include only addressable rows; the full-pool quality audit blocks on invalid and unrecognized regions.

          ### Performance
          - Generation selection indexes no longer lead with their partial-index predicate columns, so rank and random-key lookups use the index instead of scanning a whole country (seconds to milliseconds).
          - China community picks query only the alias windows communities use, with joint province/city statistics (Xiamen from 1.5-3 s to about 20 ms server time).
          - IP-region picks search the coordinate index and read only the nearest rows.
          - Translation publication adjusts country counts by each batch's change instead of recounting the country, which could hit the statement timeout.
          - Option snapshots memoize aliases, yield during builds and rebuild one at a time; app connections disable PostgreSQL JIT.

          ### Admin
          - Added the keyless Index-Translate route; credential tests show a testing state and floating success or failure notices.

          ### Upgrade notes
          - Schema migrations 34-36 run automatically: extended statistics on China communities and a concurrent, resumable rebuild of ten generation indexes (allow several minutes on large pools).

          ### Verification
          - Verified 1,590 JavaScript/TypeScript tests, 113 Python tests, type checks, builds, the public-release audit, live API validation across all 27 countries, dropdown reachability for 26 countries and 500 live address-contract samples for China.
          NOTES
      - name: Publish stable GitHub release
        shell: bash
        run: |
          version='${{ steps.version.outputs.value }}'
          gh release create "$version" \
            "release/address-$version.tar.gz" \
            "release/address-$version.zip" \
            release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "$version" \
            --notes-file release/RELEASE_NOTES.md \
            --verify-tag
